<!DOCTYPE html>
<html>
    <head>
        <title>API Key</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>Please enter a valid API key.</div>
        <form id="apiKeyForm">
            <input type="text" id="apiKey" name="apiKey" required placeholder="Enter API Key"/>
            <button id="submitApiKey" type="submit">Submit</button>
        </form>

        
        <script>
            let rootPath = "https://mysite.itvarsity.org/api/ContactBook/";
            document.getElementById("submitApiKey").addEventListener('submit', setApiKey);

            function setApiKey(e){
                e.preventDefault();
                const api = document.getElementById("apiKey").value;
                
                fetch(rootPath + "controller/api-key/?apiKey=" + apiKey)
                    .then(response => response.text())
                    .then(data => {
                        if (data === "1") {
                            localStorage.setItem("apiKey", apiKey);
                            window.open("index.html", "_self");
                        } else {
                            alert(data + " Invalid API key entered!");
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Failed to validate API key. Please try again.');
                    })
            }
        </script>
    </body>
</html>
